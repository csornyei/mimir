services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrations
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mimir:mimir@postgres:5432/mimir
    profiles:
      - migrate
    restart: "no"

  mimir-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uv run fastapi run agent_core/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      VAULT_PATH: /vault
      SEMANTIC_MEMORY_PATH: /vault/memory.md
      ENV: production
      DATABASE_URL: postgresql+asyncpg://mimir:mimir@postgres:5432/mimir
      SERVICE_NAME: agent_core
      MCP_URL: http://mimir-mcp:8010
      # LLM_BASE_URL: http://host.docker.internal:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - agent
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
      - ./scratch/memory.md:/vault/memory.md
    restart: unless-stopped

  mimir-slack:
    build:
      context: .
      dockerfile: docker/Dockerfile.slack
    command: uv run python -m slackbot.bot
    env_file: .env
    environment:
      AGENT_URL: http://mimir-api:8000
      ENV: production
      SERVICE_NAME: slack_interface
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    profiles:
      - agent
    depends_on:
      - mimir-api
    restart: unless-stopped

  mimir-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    command: uv run python -m mcp_server.server
    ports:
      - "8010:8010"
    env_file: .env
    environment:
      ENV: production
      KUBECONFIG: /kubeconfig
      SEARXNG_URL: https://searxng:8080
      SEMANTIC_MEMORY_PATH: /vault/memory.md
      DATABASE_URL: postgresql+asyncpg://mimir:mimir@postgres:5432/mimir
      SERVICE_NAME: mcp_server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    profiles:
      - agent
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/kubeconfig:ro
      - ./scratch/memory.md:/vault/memory.md
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: mimir
      POSTGRES_PASSWORD: mimir
      POSTGRES_DB: mimir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    profiles:
      - database

  searxng:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    volumes:
      - ./scratch/searxng/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    profiles:
      - support

  # Monitoring
  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345" # Alloy UI
      - "4317:4317" # OTLP gRPC
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - monitoring
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy

  tempo:
    image: grafana/tempo:latest
    volumes:
      - ./monitoring/tempo/config.yaml:/etc/tempo/config.yaml
    profiles:
      - monitoring
    command: -config.file=/etc/tempo/config.yaml

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - alloy
      - tempo
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    profiles:
      - monitoring

volumes:
  pgdata:
  core-data:
  monitoring-data:
