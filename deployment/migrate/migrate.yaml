apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-alembic-migrate
  namespace: mimir
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mimir-alembic
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mimir-alembic
          image: ghcr.io/csornyei/mimir-migrations:3.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mimir-db-secret
                  key: postgres-url
