apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: rss-digest
  namespace: argo
spec:
  schedules:
    - "10 0,6,12,18 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: rss-digest
    volumeClaimTemplates:
      - metadata:
          name: rss-workdir
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    templates:
      - name: rss-digest
        dag:
          tasks:
            - name: fetch
              template: fetch
            - name: summarize
              template: summarize
              dependencies: [fetch]
            - name: collect
              template: collect
              dependencies: [summarize]

      - name: fetch
        container:
          image: ghcr.io/csornyei/mimir-rss-fetcher:3.3.1
          args:
            - "--output"
            - "/workflow/articles.json"
          volumeMounts:
            - name: rss-workdir
              mountPath: /workflow
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SERVICE_NAME
              value: mimir-rss-fetcher
            - name: ENVIRONMENT
              value: homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4317
            - name: MINIFLUX_URL
              value: http://miniflux-svc.miniflux.svc.cluster.local:8080
            - name: MINIFLUX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mimir-miniflux-secret
                  key: miniflux-username
            - name: MINIFLUX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mimir-miniflux-secret
                  key: miniflux-password
            - name: RSS_ARTICLE_MAX_TOKENS
              value: "4000"

      - name: summarize
        container:
          image: ghcr.io/csornyei/mimir-rss-summarizer:3.3.1
          args:
            - "--input"
            - "/workflow/articles.json"
            - "--output"
            - "/workflow/summaries.json"
          volumeMounts:
            - name: rss-workdir
              mountPath: /workflow
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          env:
            - name: SERVICE_NAME
              value: mimir-rss-summarizer
            - name: ENVIRONMENT
              value: homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4317
            - name: AGENT_CORE_API_URL
              value: http://mimir-agent-svc.mimir.svc.cluster.local:8000
            - name: FILE_API_URL
              value: http://obsidian-file-api-clusterip.syncthing.svc.cluster.local:8000
            - name: SEMANTIC_MEMORY_PATH
              value: vault/memory.md
            - name: LLM_MODEL
              value: gemma4
            - name: RSS_SUMMARIZER_CONCURRENCY
              value: "5"

      - name: collect
        container:
          image: ghcr.io/csornyei/mimir-rss-collector:3.3.1
          args:
            - "--input"
            - "/workflow/summaries.json"
          volumeMounts:
            - name: rss-workdir
              mountPath: /workflow
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SERVICE_NAME
              value: mimir-rss-collector
            - name: ENVIRONMENT
              value: homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4317
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mimir-db-secret
                  key: postgres-url
            - name: MINIFLUX_URL
              value: http://miniflux-svc.miniflux.svc.cluster.local:8080
            - name: RSS_DIGEST_SCORE_THRESHOLD
              value: "7.0"
            - name: NTFY_URL
              value: http://ntfy-svc.ntfy.svc.cluster.local
            - name: NTFY_DIGEST_TOPIC
              value: mimir-digests
            - name: MIMIR_HOST
              value: https://mimir.tail30e7da.ts.net
