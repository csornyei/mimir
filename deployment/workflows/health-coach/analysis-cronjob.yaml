apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: health-analysis
  namespace: argo
spec:
  schedules:
    - "30 8 * * 1"
  timezone: "Europe/Budapest"
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: health-analysis
    arguments:
      parameters:
        - name: week-start
          value: ""
    templates:
      - name: health-analysis
        dag:
          tasks:
            - name: analyze
              template: analyze
            - name: summarize
              template: summarize
              dependencies: [analyze]

      - name: analyze
        container:
          image: ghcr.io/csornyei/mimir-health-coach-analyze:3.3.1
          args:
            - "--week-start"
            - "{{workflow.parameters.week-start}}"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SERVICE_NAME
              value: mimir-health-coach-analyze
            - name: ENVIRONMENT
              value: homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4317
            - name: TIMEZONE
              value: Europe/Budapest
            - name: OWNER_NAME
              value: Máté
            - name: LLM_MODEL
              value: gemma4
            - name: AGENT_CORE_API_URL
              value: http://mimir-agent-svc.mimir.svc.cluster.local:8000
            - name: HEALTH_COACH_ENDPOINT_URL
              value: https://health.tail30e7da.ts.net
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mimir-db-secret
                  key: postgres-url
            - name: NTFY_URL
              value: http://ntfy-svc.ntfy.svc.cluster.local
            - name: NTFY_HEALTH_TOPIC
              value: mimir-health-coach
            - name: MIMIR_HOST
              value: https://mimir.tail30e7da.ts.net

      - name: summarize
        container:
          image: ghcr.io/csornyei/mimir-health-coach-summarize:3.3.1
          args:
            - "--week-start"
            - "{{workflow.parameters.week-start}}"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SERVICE_NAME
              value: mimir-health-coach-summarize
            - name: ENVIRONMENT
              value: homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4317
            - name: TIMEZONE
              value: Europe/Budapest
            - name: LLM_MODEL
              value: gemma4
            - name: AGENT_CORE_API_URL
              value: http://mimir-agent-svc.mimir.svc.cluster.local:8000
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mimir-db-secret
                  key: postgres-url
            - name: FILE_API_URL
              value: http://obsidian-file-api-clusterip.syncthing.svc.cluster.local:8000
            - name: HEALTH_MEMORY_FILE_PATH
              value: vault/mem_health.md
