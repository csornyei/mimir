default_preset: balanced

presets:
  - name: precise
    label: Precise
    enable_thinking: true
    thinking_budget: 2000
    temperature: 0.2
    top_p: 0.9
    min_p: 0.05
    repetition_penalty: 1.0
    max_tokens: 4096

  - name: balanced
    label: Balanced
    enable_thinking: true
    thinking_budget: 2000
    temperature: 0.5
    top_p: 0.9
    min_p: 0.05
    repetition_penalty: 1.0
    max_tokens: 4096

  - name: creative
    label: Creative
    enable_thinking: true
    thinking_budget: 8000
    temperature: 0.8
    top_p: 0.95
    min_p: 0.02
    repetition_penalty: 1.05
    max_tokens: 4096

  - name: fast
    label: Fast
    enable_thinking: false
    thinking_budget: 0
    temperature: 0.3
    top_p: 0.9
    min_p: 0.05
    repetition_penalty: 1.0
    max_tokens: 2048
