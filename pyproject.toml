[project]
name = "mimir"
version = "0.1.0"
description = "Self-hosted AI assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "einops>=0.8.2",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "pgvector>=0.4.2",
    "pyaml>=26.2.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "sentence-transformers>=5.3.0",
    "slack-bolt>=1.27.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]
