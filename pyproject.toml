[project]
name = "mimir"
version = "0.1.0"
description = "Self-hosted AI assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "pgvector>=0.4.2",
]

[dependency-groups]
agent = [
    "apscheduler>=3.11.2",
    "caldav>=3.1.0",
    "einops>=0.8.2",
    "fastapi[standard]>=0.135.3",
    "lxml>=6.0.2",
    "mcp>=1.27.0",
    "pyaml>=26.2.1",
    "pymupdf>=1.27.2.2",
    "sentence-transformers>=5.3.0",
    "slack-bolt>=1.27.0",
    "watchdog>=6.0.0",
]

mcp = [
    "caldav>=3.1.0",
    "kr8s>=0.20.15",
    "mcp>=1.27.0",
]

migrations = ["alembic>=1.18.4"]

slack = ["slack-bolt>=1.27.0"]

dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-docker>=3.2.5",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires live PostgreSQL instance"]
