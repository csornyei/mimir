[project]
name = "mimir"
version = "0.1.0"
description = "Self-hosted AI assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]
