name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  version-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read PR version
        id: pr_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: "pyproject.toml"
          field: "project.version"

      - name: Export main pyproject.toml
        run: git show origin/main:pyproject.toml > /tmp/main_pyproject.toml

      - name: Read main version
        id: main_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: "/tmp/main_pyproject.toml"
          field: "project.version"

      - name: Check version is bumped
        run: |
          if [ "${{ steps.pr_version.outputs.value }}" = "${{ steps.main_version.outputs.value }}" ]; then
            echo "::error::Version '${{ steps.pr_version.outputs.value }}' matches main. Bump the version before merging."
            exit 1
          fi
          echo "Version bumped: ${{ steps.main_version.outputs.value }} -> ${{ steps.pr_version.outputs.value }}"

  check:
    name: Pre-commit and Tests
    runs-on: ubuntu-latest
    needs: version-check
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mimir:mimir@localhost:5432/mimir
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agent_ui/package-lock.json

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agent_ui

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest
