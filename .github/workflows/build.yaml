name: Build and Push

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mimir

jobs:
  check:
    name: Pre-commit and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mimir:mimir@localhost:5432/mimir
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agent_ui/package-lock.json

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agent_ui

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agent_ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agent_ui

      - name: Build frontend
        run: npm run build
        working-directory: agent_ui

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-dist
          path: agent_ui/dist/
          retention-days: 1

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [check, build-frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile
          - name: slack
            dockerfile: docker/Dockerfile.slack
          - name: mcp
            dockerfile: docker/Dockerfile.mcp
          - name: migrations
            dockerfile: docker/Dockerfile.migrations
          - name: web_fetch
            dockerfile: docker/Dockerfile.web_fetch
          - name: morning-briefing
            dockerfile: docker/Dockerfile.workflow
            build_args: module=morning_briefing.main
          - name: rss-fetcher
            dockerfile: docker/Dockerfile.workflow
            build_args: module=rss_digest.fetcher
          - name: rss-summarizer
            dockerfile: docker/Dockerfile.workflow
            build_args: module=rss_digest.summarizer
          - name: rss-collector
            dockerfile: docker/Dockerfile.workflow
            build_args: module=rss_digest.collector
          - name: health-coach
            dockerfile: docker/Dockerfile.workflow
            build_args: module=health_coach.main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: agent-ui-dist
          path: agent_ui/dist/

      - name: Read project version
        id: read_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: "pyproject.toml"
          field: "project.version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ steps.read_version.outputs.value }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
